name: Deploy Straddle to Oracle Cloud

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Straddle to Oracle Cloud VM
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "Deploying Straddle to Oracle Cloud VM..."
            cd /home/ubuntu/Straddle || git clone https://github.com/shivek-gupta/Straddle.git /home/ubuntu/Straddle
            cd /home/ubuntu/Straddle

            echo "Step 1: Backing up live runtime data..."
            mkdir -p /home/ubuntu/straddle_data_persist
            cp -p data/kotak_credentials.json /home/ubuntu/straddle_data_persist/ 2>/dev/null || true
            cp -p data/straddle_strategies.json /home/ubuntu/straddle_data_persist/ 2>/dev/null || true
            cp -p data/straddle_state.json /home/ubuntu/straddle_data_persist/ 2>/dev/null || true
            cp -p data/straddle_pnl_history.json /home/ubuntu/straddle_data_persist/ 2>/dev/null || true
            cp -p data/straddle_deleted_strategies.json /home/ubuntu/straddle_data_persist/ 2>/dev/null || true

            echo "Step 2: Pulling latest project code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Step 3: Restoring persisted data..."
            cp -p /home/ubuntu/straddle_data_persist/* data/ 2>/dev/null || true
            python3 -c "import json, os; \
            del_f = 'data/straddle_deleted_strategies.json'; \
            strat_f = 'data/straddle_strategies.json'; \
            d_ids = {'straddle_nifty_920', 'nifty 9:20 short straddle (45% tgt / 66% sl)'}; \
            if os.path.exists(del_f): \
              try: d_ids.update(x.strip().lower() for x in json.load(open(del_f))); \
              except Exception: pass; \
            for pf in (strat_f, '/home/ubuntu/straddle_data_persist/straddle_strategies.json'): \
              if os.path.exists(pf): \
                try: \
                  items = json.load(open(pf)); \
                  if isinstance(items, list): \
                    clean = [s for s in items if str(s.get('strategy_id','')).strip().lower() not in d_ids and str(s.get('name','')).strip().lower() not in d_ids]; \
                    json.dump(clean, open(pf, 'w'), indent=2); \
                except Exception: pass" 2>/dev/null || true

            echo "Step 4: Installing requirements..."
            python3 -m pip install -r requirements.txt --quiet || true

            echo "Step 5: Ensuring systemd service is active..."
            sudo cp -u straddle.service /etc/systemd/system/ 2>/dev/null || true
            sudo systemctl daemon-reload 2>/dev/null || true
            sudo systemctl enable straddle 2>/dev/null || true
            sudo systemctl restart straddle
            echo "Straddle deployment complete! Service status:"
            sudo systemctl is-active straddle
